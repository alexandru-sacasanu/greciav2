<dialog id="hg-offer-modal" aria-labelledby="hg-offer-title">
 <div class="hg-inner">
  <button class="hg-close" type="button" aria-label="Închide detaliile" autofocus>×</button>
  <p class="hg-breadcrumb"></p>
  <div class="hg-title-row"><h2 id="hg-offer-title"></h2><button class="hg-favorite" type="button" aria-label="Salvează la favorite" aria-pressed="false">♡</button></div>
  <p class="hg-location"></p><div class="hg-gallery"></div>
  <div class="hg-all-photos" hidden></div>
  <div class="hg-photo-stage" hidden role="dialog" aria-modal="true" aria-label="Fotografie mărită"><button type="button" class="hg-stage-close" aria-label="Închide fotografia">×</button><button type="button" class="hg-stage-prev" aria-label="Fotografia anterioară">‹</button><div class="hg-photo-stage-content"><img alt=""></div><button type="button" class="hg-stage-next" aria-label="Fotografia următoare">›</button><div class="hg-stage-counter"></div></div>
  <div class="hg-columns"><section class="hg-description"><div class="hg-specs"></div><h3 class="hg-summary"></h3><p class="hg-copy hg-description-text"></p><div class="hg-chips"></div><h3 class="hg-small-heading hg-includes-title">Ce include</h3><p class="hg-copy hg-includes"></p><p class="hg-copy hg-contact"></p></section>
  <aside class="hg-booking"><div class="hg-price"></div><form class="hg-form"><div class="hg-dates"><label><span class="hg-start-label">Check-in</span><input name="start" type="date" required></label><label class="hg-end-field"><span class="hg-end-label">Check-out</span><input name="end" type="date" required></label></div><label class="hg-quantity"><span class="hg-quantity-label">Persoane</span><select name="quantity"></select></label><button class="hg-submit">Solicită disponibilitatea →</button><p class="hg-note">Confirmăm prețul și disponibilitatea prin contact.</p><p class="hg-status" role="status" aria-live="polite"></p></form></aside></div>
 </div>
</dialog>
<script>
(() => {
 'use strict';
 const modal=document.getElementById('hg-offer-modal');if(!modal)return;
 const q=s=>modal.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const icons={people:'<circle cx="9" cy="7" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3M17 4a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5"/>',bed:'<path d="M3 19V8m18 11V8M3 15h18M6 11V6h12v5M3 11h18v7H3"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',car:'<path d="m5 7 2-3h10l2 3 2 3v8H3v-8l2-3Zm-2 3h18M6 18v3m12-3v3M6 13h2m8 0h2"/>',check:'<circle cx="12" cy="12" r="9"/><path d="m7 12 3 3 7-7"/>',gear:'<path d="M12 3v18M5 7h14M5 17h7M5 3v8m14-8v8M5 13v8"/>',gallery:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="16" cy="8" r="1"/>'};
 const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]||icons.check}</svg>`;
 const types={accommodation:{label:'Cazări',start:'Check-in',end:'Check-out',quantity:'Oaspeți',unit:'noapte'},car:{label:'Mașini',start:'Preluare',end:'Predare',quantity:'Mașini',unit:'zi'},atv:{label:'ATV',start:'Preluare',end:'Predare',quantity:'ATV-uri',unit:'zi'},excursion:{label:'Excursii',start:'Data excursiei',quantity:'Participanți',unit:'persoană'},cruise:{label:'Croaziere',start:'Data croazierei',quantity:'Participanți',unit:'persoană'}};
 const units={night:'noapte',day:'zi',person:'persoană',trip:'excursie'};
 const saved=new Set();let active=null,options={},activePhotos=[],currentPhotoIndex=0,previousFocus=null,previousOverflow='',requestId=0;
 const dateString=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
 function safeImage(src){if(typeof src!=='string'||!src.trim())return '';try{const url=new URL(src,document.baseURI);return ['https:','http:'].includes(url.protocol)||url.protocol==='file:'?url.href:''}catch{return ''}}
 function kind(o){return o.type==='rental'?(o.rental_kind==='atv'?'atv':'car'):o.type}
 function photos(o){const list=Array.isArray(o.photos)?o.photos:[];return list.map(p=>typeof p==='string'?{url:safeImage(p),alt:o.title}:{url:safeImage(p.url),alt:p.alt||o.title}).filter(p=>p.url)}
 function paintFavorite(){const on=typeof options.isFavorite==='function'?!!options.isFavorite(active.id):saved.has(active.id);q('.hg-favorite').textContent=on?'♥':'♡';q('.hg-favorite').setAttribute('aria-pressed',String(on))}
 function showPhoto(index){if(!activePhotos.length)return;if(index<0)index=activePhotos.length-1;if(index>=activePhotos.length)index=0;currentPhotoIndex=index;const p=activePhotos[index];if(!p)return;const stage=q('.hg-photo-stage'),img=q('.hg-photo-stage img'),prev=q('.hg-stage-prev'),next=q('.hg-stage-next'),counter=q('.hg-stage-counter');img.src=p.url;img.alt=p.alt||active?.title||'';if(prev&&next){prev.hidden=activePhotos.length<=1;next.hidden=activePhotos.length<=1;}if(counter){counter.textContent=activePhotos.length>1?`${index+1} / ${activePhotos.length}`:'';}stage.hidden=false;q('.hg-stage-close')?.focus();}
 function closePhoto(){const stage=q('.hg-photo-stage');if(!stage||stage.hidden)return;stage.hidden=true;q('.hg-gallery button')?.focus();}
 function paintPhotos(){const list=activePhotos;const g=q('.hg-gallery');g.className='hg-gallery'+(list.length===1?' hg-one':list.length===2?' hg-two':'');g.innerHTML=list.length?list.slice(0,3).map((p,i)=>`<button type="button" data-photo="${i}" aria-label="Deschide fotografia ${i+1}"><img src="${esc(p.url)}" alt="${esc(p.alt)}"></button>`).join('')+(list.length>1?`<button type="button" class="hg-gallery-all" aria-expanded="false">${icon('gallery')}Vezi toate fotografiile (${list.length})</button>`:''):'<div class="hg-no-photos">Fotografii în curând</div>';q('.hg-all-photos').innerHTML=list.map((p,i)=>`<button type="button" data-photo="${i}" aria-label="Deschide fotografia ${i+1}"><img src="${esc(p.url)}" alt="${esc(p.alt)}" loading="lazy"></button>`).join('');q('.hg-all-photos').hidden=true;q('.hg-photo-stage').hidden=true}
 function specifications(o,k){const rows=[];if(o.capacity)rows.push(['people',o.capacity+(k==='car'||k==='atv'?' locuri':' persoane')]);if(k==='accommodation'){if(o.rooms_count!=null)rows.push(['bed',o.rooms_count+(o.rooms_count===1?' cameră':' camere')]);if(o.bedrooms!=null)rows.push(['bed',o.bedrooms+' dormitoare']);if(o.bathrooms!=null)rows.push(['check',o.bathrooms+' băi'])}if(k==='car'||k==='atv'){if(o.transmission)rows.push(['gear',o.transmission]);if(o.engine_cc)rows.push(['car',o.engine_cc+' cm³']);if(o.fuel)rows.push(['car',o.fuel])}if(o.duration_minutes){const h=Math.floor(o.duration_minutes/60),m=o.duration_minutes%60;rows.push(['clock',(h?h+' ore':'')+(m?' '+m+' min':'')])}if(o.available_from&&o.available_to){rows.push(['clock','Disponibil: '+o.available_from+' → '+o.available_to])}else if(o.available_from){rows.push(['clock','Disponibil din: '+o.available_from])}if(Array.isArray(o.highlights))o.highlights.forEach(s=>rows.push(['check',s]));return rows.slice(0,6)}
 function datesValid(){const form=q('form'),start=form.elements.start,end=form.elements.end,k=kind(active),oneDay=!types[k].end;start.setCustomValidity('');end.setCustomValidity('');if(active?.available_from&&start.value&&start.value<active.available_from)start.setCustomValidity('Oferta este disponibilă începând cu '+active.available_from);if(active?.available_to&&start.value&&start.value>active.available_to)start.setCustomValidity('Oferta este disponibilă până la '+active.available_to);if(!oneDay){const d=new Date(start.value+'T12:00:00');if(!Number.isNaN(d.getTime())){if(k==='accommodation')d.setDate(d.getDate()+1);end.min=dateString(d);if(end.value&&end.value<end.min)end.setCustomValidity(k==='accommodation'?'Check-out trebuie să fie după check-in.':'Predarea nu poate fi înainte de preluare.');if(active?.available_to&&end.value&&end.value>active.available_to)end.setCustomValidity('Oferta este disponibilă până la '+active.available_to)}}return form.checkValidity()}
 function open(offer,config={}){if(!offer?.id||!offer.title)throw Error('Oferta necesită id și title.');const k=kind(offer),type=types[k];if(!type)throw Error('Tip de ofertă necunoscut.');if(!modal.open){previousFocus=document.activeElement;previousOverflow=document.body.style.overflow}modal.scrollTop=0;requestId++;active=offer;options=config;activePhotos=photos(offer);q('#hg-offer-title').textContent=offer.title;q('.hg-breadcrumb').textContent=[offer.destination_name,type.label].filter(Boolean).join(' / ');q('.hg-location').textContent='⌖ '+[offer.locality,offer.destination_name].filter(Boolean).join(', ');q('.hg-summary').textContent=offer.summary||offer.title;q('.hg-description-text').textContent=offer.description||'';q('.hg-specs').innerHTML=specifications(offer,k).map(([n,text])=>`<span class="hg-spec">${icon(n)}${esc(text)}</span>`).join('');q('.hg-chips').innerHTML=(offer.amenities||[]).map(s=>`<span class="hg-chip">${esc(s)}</span>`).join('');q('.hg-includes').textContent=offer.includes_text||'';q('.hg-includes').hidden=q('.hg-includes-title').hidden=!offer.includes_text;q('.hg-contact').textContent=offer.contact_text||'';
 let price='Preț la cerere';if(offer.price_from!=null){const amount=Number(offer.price_from);if(Number.isFinite(amount)&&amount>=0){let formatted;try{formatted=new Intl.NumberFormat('ro-RO',{style:'currency',currency:offer.currency||'EUR',maximumFractionDigits:2}).format(amount)}catch{formatted=String(amount)+' '+(offer.currency||'EUR')}price=`de la <b>${esc(formatted)}</b> / ${esc(units[offer.price_unit]||type.unit)}`}}q('.hg-price').innerHTML=price+'<small>Preț orientativ</small>';
 const f=q('form');f.reset();q('.hg-start-label').textContent=type.start;q('.hg-end-label').textContent=type.end||'';q('.hg-end-field').hidden=!type.end;f.elements.end.disabled=!type.end;f.elements.end.required=!!type.end;q('.hg-dates').classList.toggle('hg-single',!type.end);q('.hg-quantity-label').textContent=type.quantity;const vehicle=k==='car'||k==='atv',max=vehicle?5:Math.min(Number(offer.capacity)||20,100),count=Math.max(1,max);f.elements.quantity.innerHTML=Array.from({length:count},(_,i)=>`<option value="${i+1}">${i+1}${vehicle?(k==='atv'?' ATV':' mașini'):' persoane'}</option>`).join('');f.elements.quantity.value=String(vehicle?1:Math.min(2,count));const start=new Date();start.setDate(start.getDate()+1);const end=new Date(start);end.setDate(end.getDate()+(k==='accommodation'?7:1));f.elements.start.min=dateString(new Date());if(offer.available_from){const todayStr=dateString(new Date());f.elements.start.min=offer.available_from>todayStr?offer.available_from:todayStr;}if(offer.available_to){f.elements.start.max=offer.available_to;f.elements.end.max=offer.available_to;}f.elements.start.value=config.selection?.start_date||dateString(start);if(f.elements.start.min&&f.elements.start.value<f.elements.start.min)f.elements.start.value=f.elements.start.min;f.elements.end.value=config.selection?.end_date||dateString(end);if(offer.available_to&&f.elements.end.value>offer.available_to)f.elements.end.value=offer.available_to;q('.hg-status').textContent='';q('.hg-submit').disabled=false;paintPhotos();paintFavorite();datesValid();document.body.style.overflow='hidden';if(!modal.open)modal.showModal();q('.hg-close').focus();}
 q('.hg-close').onclick=()=>modal.close();modal.addEventListener('close',()=>{requestId++;q('.hg-photo-stage').hidden=true;document.body.style.overflow=previousOverflow;if(previousFocus?.isConnected)previousFocus.focus()});modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()}});
 q('.hg-gallery').onclick=e=>{const all=e.target.closest('.hg-gallery-all'),photo=e.target.closest('[data-photo]');if(all){const el=q('.hg-all-photos');el.hidden=!el.hidden;all.setAttribute('aria-expanded',String(!el.hidden))}else if(photo)showPhoto(Number(photo.dataset.photo))};q('.hg-all-photos').onclick=e=>{const photo=e.target.closest('[data-photo]');if(photo)showPhoto(Number(photo.dataset.photo))};
 q('.hg-photo-stage').onclick=e=>{const close=e.target.closest('.hg-stage-close'),prev=e.target.closest('.hg-stage-prev'),next=e.target.closest('.hg-stage-next'),img=e.target.closest('img');if(close){closePhoto();}else if(prev){e.stopPropagation();showPhoto(currentPhotoIndex-1);}else if(next){e.stopPropagation();showPhoto(currentPhotoIndex+1);}else if(!img){closePhoto();}};
 modal.addEventListener('keydown',e=>{const stage=q('.hg-photo-stage');if(!stage||stage.hidden)return;if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closePhoto();}else if(e.key==='ArrowLeft'&&activePhotos.length>1){e.preventDefault();showPhoto(currentPhotoIndex-1);}else if(e.key==='ArrowRight'&&activePhotos.length>1){e.preventDefault();showPhoto(currentPhotoIndex+1);}});
 q('.hg-favorite').onclick=()=>{if(!active)return;try{if(options.onFavorite)options.onFavorite(active.id);else saved.has(active.id)?saved.delete(active.id):saved.add(active.id);paintFavorite()}catch{q('.hg-status').textContent='Favorita nu a putut fi actualizată.'}};
 q('form').addEventListener('input',datesValid);q('form').onsubmit=async e=>{e.preventDefault();if(!datesValid()){e.currentTarget.reportValidity();return}const f=e.currentTarget,k=kind(active),offer=active,config=options,token=requestId;const request={offer_id:offer.id,title:offer.title,type:offer.type,rental_kind:offer.rental_kind||null,destination:offer.destination_name||'',start_date:f.elements.start.value,end_date:types[k].end?f.elements.end.value:null,quantity:Number(f.elements.quantity.value)};q('.hg-status').textContent='';q('.hg-submit').disabled=true;try{if(typeof config.onInquiry==='function'){await config.onInquiry(request);if(token===requestId)q('.hg-status').textContent='Solicitarea a fost transmisă. Disponibilitatea urmează să fie confirmată.'}else{const email=String(config.contactEmail||'').trim();if(!/^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$/.test(email))throw Error('Configurează contactEmail sau un callback onInquiry pentru solicitări.');const body=['Bună ziua,','Doresc detalii despre: '+request.title,'Destinație: '+request.destination,typeName(k)+': '+request.start_date+(request.end_date?' → '+request.end_date:''),'Număr '+types[k].quantity.toLowerCase()+': '+request.quantity,'ID ofertă: '+request.offer_id].join('\n');window.location.href='mailto:'+encodeURIComponent(email)+'?subject='+encodeURIComponent('Solicitare disponibilitate: '+request.title)+'&body='+encodeURIComponent(body);q('.hg-status').textContent='Se deschide aplicația de email. Solicitarea se trimite din acea aplicație.'}}catch(err){if(token===requestId)q('.hg-status').textContent=err.message||'Solicitarea nu a putut fi trimisă.'}finally{if(token===requestId)q('.hg-submit').disabled=false}};
 function typeName(k){return k==='car'||k==='atv'?'Perioadă':k==='accommodation'?'Sejur':'Data'}
 window.HGOfferModal={open,close:()=>modal.close()};
